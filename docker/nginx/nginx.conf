# nginx main configuration.
#
# Runs entirely as www-data under supervisor — nothing binds a port below
# 1024, so there is no reason for a root master process. Every path nginx
# needs to write is therefore moved off the packaged /var/lib/nginx and /run
# defaults, which are root-owned.

worker_processes  auto;
daemon            off;
pid               /tmp/nginx/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to the container's stdout/stderr so `docker compose logs` is the
    # single place to look, and the daemon never grows a file inside the
    # container's writable layer.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /dev/stdout  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    server_tokens       off;
    types_hash_max_size 2048;

    # Long enough not to cut a slow SharePoint-backed download short, but not
    # so long that a wedged FPM worker is invisible. Websockets get their own,
    # much longer, timeouts in app.conf.
    keepalive_timeout   65;
    client_body_timeout 300s;
    send_timeout        300s;

    # Writable-by-www-data scratch. /tmp is the container's real filesystem
    # here, not a tmpfs — FolderTree::zip() builds uncapped whole-folder
    # archives through sys_get_temp_dir() and would hit ENOSPC on a small one.
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/rss+xml font/ttf font/otf
                      image/svg+xml application/wasm;

    # Rendered at container start from /etc/nginx/templates/*.template so the
    # listen port can follow TMA_NGINX_PORT. /etc stays read-only to the
    # non-root runtime user; /tmp/nginx is writable.
    include /tmp/nginx/conf.d/*.conf;
}
