[www]
user  = www-data
group = www-data

; A unix socket, not 127.0.0.1:9000 — nginx runs in this same container, so
; there is no reason to pay for a TCP round trip or to expose the FPM port.
listen       = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ---------------------------------------------------------------------------
; The single most important line in this file.
;
; php-fpm defaults to clear_env = yes, which strips the process environment
; from every worker. Laravel reads configuration through $_ENV/$_SERVER, so
; with the default every env var set by compose vanishes and the app silently
; falls back to config defaults: DB_CONNECTION becomes 'sqlite', CACHE_STORE
; becomes 'file', APP_KEY becomes empty. It fails as "MissingAppKeyException"
; or an empty SQLite database, never as "your environment was cleared".
; ---------------------------------------------------------------------------
clear_env = no

; ---------------------------------------------------------------------------
; Worker pool.
;
; Sized for a container with ~1 GB of memory available to PHP: Laravel request
; peak sits around 60-80 MB, so 20 children is roughly 1.6 GB worst case and
; comfortably under that in practice. Override per environment with
;   PHP_FPM_MAX_CHILDREN, etc. — see docker/entrypoint.sh.
; ---------------------------------------------------------------------------
pm                   = dynamic
pm.max_children      = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers     = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}

; Recycle workers periodically. Guards against slow leaks in long-lived
; processes without the cost of pm = ondemand.
pm.max_requests = 500

; ---------------------------------------------------------------------------
; Logging: everything to the container's stdout/stderr.
; decorate_workers_output = no keeps the raw line intact, so a JSON log line
; from Monolog stays parseable instead of being wrapped in FPM's prefix.
; ---------------------------------------------------------------------------
catch_workers_output    = yes
decorate_workers_output = no
access.log              = /dev/null

; A request that has been running this long is wedged; log a backtrace so the
; cause is visible in `docker compose logs` rather than inferred.
request_slowlog_timeout = 30s
slowlog                 = /dev/stderr

; The backstop for a wedged worker — NOT the request budget.
;
; app.conf sets `fastcgi_request_buffering off` so large uploads stream straight
; through to PHP instead of being spooled by nginx first. That means the body
; transfer happens inside the FPM request, and this timeout therefore bounds
; upload wall-clock too. At 310s a genuinely large upload over a slow link dies
; with a bare 502 and nothing in the log to explain it. max_execution_time (300s)
; is the real guard on script time; this is only here so a hung worker cannot be
; held forever, and slowlog surfaces anything over 30s long before it trips.
request_terminate_timeout = 3600s

; Health/status for the healthcheck and for debugging. Not routed by nginx, so
; it is reachable only via cli-fcgi inside the container.
pm.status_path = /fpm-status
ping.path      = /fpm-ping
