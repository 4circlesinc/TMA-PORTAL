; Development overrides. Loaded after zz-tma.ini.

; Pick up edited files immediately — the source is a bind mount in dev.
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 0

; Laravel renders its own error pages; these keep PHP-level fatals visible in
; the log stream too. display_errors stays Off so a notice can never corrupt a
; JSON response body.
error_reporting = E_ALL
log_errors      = On

; Xdebug is installed but inert until XDEBUG_MODE is set on the service:
;   XDEBUG_MODE=debug docker compose up app
; client_host works out of the box on Docker Desktop; on a Linux host add
;   extra_hosts: ["host.docker.internal:host-gateway"]
xdebug.mode         = off
xdebug.client_host  = host.docker.internal
xdebug.client_port  = 9003
xdebug.start_with_request = trigger
xdebug.idekey       = TMA
