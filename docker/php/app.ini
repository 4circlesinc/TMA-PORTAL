; TMA-PORTAL PHP settings.
;
; Loaded as conf.d/zz-tma.ini so it wins over anything the base image ships.
; These are the values the *application* needs; per-stage differences (OPcache
; revalidation, Xdebug) live in dev.ini / entrypoint.

; --- limits ----------------------------------------------------------------
; The base image ships upload_max_filesize=2M / post_max_size=8M. Those do not
; error — they downgrade the product. Messages and Feed advertise their own
; limits, and App\Support\Files\FileType::MAX_BYTES is 2 GiB, so leaving the
; defaults would look like an application bug rather than a PHP setting.
upload_max_filesize = 2G
post_max_size       = 2G
max_file_uploads    = 200

; Uploads stream to disk, so this bounds real work (PDF stamping via FPDI,
; GD thumbnailing, folder ZIP assembly) rather than upload size.
memory_limit        = 512M

; Web requests only. Queue workers get their timeout from --timeout, which is
; why ext-pcntl is a hard requirement.
max_execution_time  = 300
max_input_time      = 300
max_input_vars      = 5000

; --- correctness -----------------------------------------------------------
; config/app.php hard-codes 'UTC' and every timestamp is rendered in the
; reader's zone client-side; keep PHP agreeing with it.
date.timezone = UTC

; Errors belong in the log stream, never in an HTTP response body. server.php
; documents what happens when a stray notice lands in front of a JSON body.
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_log             = /dev/stderr
error_reporting       = E_ALL

; --- hardening -------------------------------------------------------------
expose_php                = Off
allow_url_fopen           = On
allow_url_include         = Off
session.use_strict_mode   = 1
zend.exception_ignore_args = On

; --- opcache ---------------------------------------------------------------
; Production values. dev.ini turns revalidation back on.
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 0
opcache.save_comments           = 1
opcache.fast_shutdown           = 1

; JIT stays off. It is a loss for typical request/response PHP and has a
; history of subtle miscompiles; nothing in this app is CPU-bound in a way
; that would benefit.
opcache.jit        = disable
opcache.jit_buffer_size = 0

; --- realpath cache --------------------------------------------------------
; Laravel touches thousands of files per request; the default 4M/120s cache is
; the single cheapest FPM win, and matters more on a bind-mounted macOS volume.
realpath_cache_size = 8M
realpath_cache_ttl  = 300
