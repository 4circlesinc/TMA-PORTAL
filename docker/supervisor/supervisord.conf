; Process manager for the `app` service: nginx and php-fpm side by side.
;
; Worker, scheduler and reverb services run a single foreground process each
; and bypass supervisor entirely — compose is their process manager, and a
; crashed worker should be restarted by Docker (with its restart policy and
; backoff), not silently resurrected inside a container that still looks
; healthy from the outside.

[supervisord]
nodaemon   = true
user       = www-data
logfile    = /dev/stdout
logfile_maxbytes = 0
pidfile    = /tmp/supervisord.pid
childlogdir = /tmp

; SIGTERM to supervisord must reach the children, or `docker compose down`
; waits out the full grace period on every stop.
[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command   = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
startsecs = 3
priority  = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; php-fpm treats SIGQUIT as "finish in-flight requests, then exit".
stopsignal   = QUIT
stopwaitsecs = 30

[program:nginx]
; php-fpm first: nginx's unix socket upstream must exist before it accepts.
command   = nginx
autostart = true
autorestart = true
startsecs = 3
priority  = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopsignal   = QUIT
stopwaitsecs = 30

[eventlistener:shutdown]
; If either process dies for good, take the container down so Docker's restart
; policy and healthcheck see the failure. A container that stays "up" with a
; dead php-fpm is the worst of both worlds.
; `kill -TERM`, not `kill -SIGTERM`: /bin/sh here is dash, which rejects the
; SIG-prefixed form with "kill: Illegal option -S" and so never fires.
command = sh -c 'printf "READY\n"; while read -r line; do echo "supervisor: $line" >&2; kill -TERM $PPID; printf "RESULT 2\nOK"; done'
events  = PROCESS_STATE_FATAL
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
