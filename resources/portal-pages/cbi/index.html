<head>

  <link rel="icon" type="image/png" href="images/brand/tma/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css?v=101">

  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--color-bg-page); }
  </style>
</head>
<body>
  <!--
    CBI chromeless development preview — served at /dev/cbi (FEATURE_CBI +
    admin, 404 otherwise). This is the SAME module that ships in the SPA
    shell at /cbi, which has its own SPA_PAGES entry, sidebar row and
    cbi.view capability. This file exists only to mount the view without the
    sidebar, so it can be developed and screenshotted in isolation. Both
    doors load public/js/cbi.js, which self-mounts on #cbi-root here and
    registers via TMAPortalViews.register('cbi', mount) in the shell.
  -->
  <div class="cbi-shell">
    <header class="cbi-shell__bar">
      <a class="cbi-shell__brand" href="/dashboard" title="Back to the portal">
        <img src="images/brand/tma/favicon.png" alt="" width="20" height="20">
        <span>TM ANTOINE Advisory</span>
      </a>
      <span class="cbi-shell__flag">CBI · Development preview</span>
    </header>
    <main class="cbi-shell__main">
      <div id="cbi-root" data-portal-mount></div>
    </main>
  </div>

  <script src="js/dom-morph.js"></script>
  <script src="js/toast-icons.js"></script>
  <script src="js/i18n.js?v=1"></script>
  <script src="js/toast.js?v=12"></script>
  <script src="js/tab-group.js?v=2"></script>
  <script src="js/portal-views.js?v=2"></script>
  <script src="js/portal-store.js?v=3" defer></script>
  <script src="js/portal-queue.js?v=1" defer></script>
  <script src="js/portal-sync-status.js?v=2" defer></script>
  <script src="js/presence-status.js?v=5"></script>
  <script src="js/current-user.js?v=13"></script>
  <script src="js/file-icons.js"></script>
  <script src="js/folder-colours.js"></script>
  <script src="js/folder-icons.js"></script>
  <script src="js/portal-lightbox.js?v=2"></script>
  <script src="js/portal-upload-manager.js?v=5"></script>
  <script src="js/portal-files.js?v=7"></script>
  <script src="js/sync-toasts.js?v=5"></script>
  <script src="js/cbi.js?v=12"></script>
</body>
</html>
