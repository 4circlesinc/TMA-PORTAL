  <!--
    CBI development preview — served only at /dev/cbi (FEATURE_CBI + admin,
    404 otherwise). Deliberately NOT part of the SPA shell: no sidebar, no
    SPA_PAGES entry, nothing for search or quick actions to index. The
    module inside follows the portal-view pattern, so promoting it into the
    shell later is a data-view div + register() call, not a rewrite.
  -->
  <div class="cbi-shell">
    <header class="cbi-shell__bar">
      <a class="cbi-shell__brand" href="/dashboard" title="Back to the portal">
        <img src="images/brand/tma/favicon.png" alt="" width="20" height="20">

      </a>
      <span class="cbi-shell__flag">CBI · Development preview</span>
    </header>
    <main class="cbi-shell__main">
      <div id="cbi-root" data-portal-mount></div>
    </main>
  </div>
