<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; }

  body {
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    gap: 16px;
    color: #1c1c1c;
    background: #fff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  h1 { font-size: 19px; margin: 0; font-weight: 600; }

  p { margin: 0; color: #6b6b6b; max-width: 22rem; justify-self: center; }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
  }

  .primary {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 8px;
    border: 0;
    background: #1c1c1c;
    color: #fff;
    text-decoration: none;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .primary:hover { background: #333; }

  .back {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-size: 14px;
    color: #6b6b6b;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  .back:hover { color: #1c1c1c; }

  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #f2f2f2; }
    p, .back { color: #9a9a9a; }
    .back:hover { color: #f2f2f2; }
    .primary { background: #f2f2f2; color: #141414; }
    .primary:hover { background: #fff; }
  }
</style>
</head>
<body>
  <h1>Continue in your browser</h1>
  <p id="detail">Finish signing in, then return here.</p>
  <div class="actions">
    <button type="button" class="primary" id="open">Open in browser</button>
    <button type="button" class="back" id="back">Back to sign in</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var provider = params.get('provider') || '';
      var detail = document.getElementById('detail');

      if (provider) {
        detail.textContent = 'Finish signing in with ' + provider + ', then return here.';
      }

      document.getElementById('open').addEventListener('click', function () {
        document.documentElement.setAttribute('data-tma-signin-reopen', String(Date.now()));
      });

      document.getElementById('back').addEventListener('click', function () {
        document.documentElement.setAttribute('data-tma-signin-cancel', String(Date.now()));
      });
    })();
  </script>
</body>
</html>
