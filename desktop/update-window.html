<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Updating</title>
<style>
  /* Let the system decide; the glass behind this is light or dark to match. */
  :root { color-scheme: light dark; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    /* Transparent all the way down, or the window's vibrancy is painted over
       and the glass turns into a flat rectangle. */
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  /* Frameless, so the whole surface drags. */
  .screen {
    -webkit-app-region: drag;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 40px;
    /* The window is transparent, so the corner has to be drawn here. Matched to
       the radius macOS gives a panel this size. */
    border-radius: 16px;
    /* A hairline lift, the way AppKit separates a material from what is under
       it. Barely visible, and the thing that stops the panel looking pasted on. */
    box-shadow: inset 0 0 0 0.5px light-dark(rgba(0,0,0,.10), rgba(255,255,255,.12));
  }

  .mark {
    width: 48px;
    height: 48px;
    display: block;
    object-fit: contain;
  }

  .track {
    width: 100%;
    /* Thin, the way a system progress bar is. */
    height: 4px;
    border-radius: 999px;
    background: light-dark(rgba(0,0,0,.10), rgba(255,255,255,.16));
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: #03a5e9;
    transition: width 180ms ease-out;
  }

  /*
   * Unzipping and swapping the bundle report no progress, so there is no
   * percentage to show at the point the app is busiest.
   *
   * A shimmer across a full-width bar, not a stripe travelling through an empty
   * one: a stripe narrower than the track spends part of every cycle completely
   * outside it, so the bar reads as empty and stalled — the opposite of what it
   * is there to say.
   */
  .track.is-indeterminate .fill {
    width: 100% !important;
    background: linear-gradient(90deg, rgba(3,165,233,.35) 25%, #03a5e9 50%, rgba(3,165,233,.35) 75%);
    background-size: 220% 100%;
    animation: sweep 1.3s linear infinite;
  }

  @keyframes sweep {
    from { background-position: 220% 0; }
    to   { background-position: -220% 0; }
  }

  /* The only words on the screen. */
  .caption {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: light-dark(rgba(0,0,0,.55), rgba(255,255,255,.62));
    min-height: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
    .track.is-indeterminate .fill { animation: none; }
  }
</style>
</head>
<body>
  <div class="screen">
    <img class="mark" src="assets/logo-mark.png" alt="" aria-hidden="true" width="48" height="48">

    <div class="track" id="track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" id="fill"></div>
    </div>

    <p class="caption" id="caption">Updating</p>
  </div>

<script>
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  // Not `caption`-adjacent naming by accident: the element must not be called
  // `status`, because window.status is a legacy string setter and a top-level
  // `var status` would become a string, silently swallowing every write.
  var caption = document.getElementById('caption');

  var percent = 0;
  var phase = 'downloading';

  function paint() {
    if (phase === 'downloading') {
      track.classList.remove('is-indeterminate');
      fill.style.width = percent + '%';
      track.setAttribute('aria-valuenow', String(percent));
      caption.textContent = 'Downloading ' + percent + '%';
      return;
    }

    // No number to show, so drop the value rather than leave a stale one.
    track.classList.add('is-indeterminate');
    track.removeAttribute('aria-valuenow');
    caption.textContent = phase === 'installing' ? 'Installing' : 'Restarting';
  }

  // The version is not on screen — it is one more thing to read for something
  // nobody is choosing between. It goes to the window title, which is what
  // VoiceOver announces and what the Window menu lists.
  window.TMAUpdate.onVersion(function (version) {
    document.title = version ? 'Updating to ' + version : 'Updating';
  });

  window.TMAUpdate.onPhase(function (next) {
    phase = next;
    paint();
  });

  window.TMAUpdate.onProgress(function (fraction) {
    percent = Math.max(0, Math.min(100, Math.round(fraction * 100)));
    if (phase === 'downloading') paint();
  });

  paint();
</script>
</body>
</html>
