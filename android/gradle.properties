org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships built-in Kotlin; the modules apply the Kotlin Gradle plugin themselves for now.
android.builtInKotlin=false
# AGP 9 new DSL and the classic Kotlin Android plugin do not mix; opt out until the modules migrate to built-in Kotlin.
android.newDsl=false
