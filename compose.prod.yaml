# =============================================================================
# TMA-PORTAL — production stack
# =============================================================================
#
#   cp .env.docker.example .env.production      # then edit it, see below
#   docker compose -f compose.prod.yaml up -d --build
#
# A separate file, not an override of compose.yaml, so that a development bind
# mount, Xdebug, a published database port or the public development APP_KEY
# cannot reach production by inheritance.
#
# Before the first start, .env.production must set:
#
#   APP_ENV=production            APP_DEBUG=false
#   APP_KEY=<the real key>        APP_PREVIOUS_KEYS=<the real previous keys>
#   APP_URL=https://your.host     SESSION_SECURE_COOKIE=true
#   POSTGRES_PASSWORD / DB_PASSWORD=<a real password>
#   REVERB_APP_ID / _KEY / _SECRET=<real values, identical for every service>
#   FILES_DISK=s3  AVATAR_DISK=s3  AWS_* =<the R2 credentials>
#   MAIL_MAILER=microsoft-graph   MICROSOFT_GRAPH_TENANT_ID=<tenant GUID>
#
# APP_KEY is not a formality. ConnectedAccount.token uses the `encrypted` cast,
# so a different key makes every stored Microsoft and Google OAuth token
# permanently undecryptable. Carry APP_PREVIOUS_KEYS too — one rotation has
# already happened. Never run `artisan key:generate` here.
#
# The entrypoint refuses to start if APP_ENV=production while APP_KEY is empty
# or still the public development key, or if APP_DEBUG is on.
#
# TLS: this stack speaks plain HTTP on 8001 and expects a TLS-terminating proxy
# in front of it (see the reverse-proxy section of README.md). bootstrap/app.php
# calls trustProxies(at: '*'), so that proxy MUST overwrite X-Forwarded-* rather
# than pass a client's through — publish 8001 on a private interface only.
# =============================================================================

name: tma-portal-prod

x-logging: &logging
  # Bound the JSON log files so a container cannot fill the host disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &security
  security_opt:
    - no-new-privileges:true

x-php: &php
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: prod
  image: tma-portal:prod
  env_file:
    - path: .env.production
      required: true
  environment: &php-env
    # Forced here so a stale line in .env.production cannot weaken them.
    APP_ENV: production
    APP_DEBUG: "false"
  restart: unless-stopped
  logging: *logging
  <<: *security
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:

  # ---------------------------------------------------------------------------
  # Postgres 18.
  #
  # Delete this service and point DB_HOST at the managed instance if you have
  # one — that is the better answer for anything with a real backup story. If
  # you keep it, the pgdata volume is the only copy of the database: see
  # "Resetting development data" and the backup notes in README.md.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    logging: *logging
    <<: *security
    env_file:
      - path: .env.production
        required: true
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. The Postgres 18
      # images store data in a major-version subdirectory so that
      # `pg_upgrade --link` can work across a single mount point; mounting the
      # old 17-and-earlier path makes the image refuse to start with
      # "there appears to be PostgreSQL data in /var/lib/postgresql/data
      # (unused mount/volume)".
      - pgdata:/var/lib/postgresql
    # No ports. The database is reachable only from this compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 60s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    <<: *security
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Schema, once, before anything serves traffic.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *php
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No --seed in production: DatabaseSeeder reads ADMIN_* through env(),
    # which returns null once config:cache has run, and would then create an
    # administrator with a random password printed to a log nobody is reading.
    command: php artisan migrate --force --isolated
    volumes:
      - logs:/var/www/html/storage/logs

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------
  app:
    <<: *php
    ports:
      # Bind to loopback and terminate TLS in front of it. Publishing this on
      # 0.0.0.0 exposes an app that trusts X-Forwarded-* from anyone.
      - "${TMA_APP_BIND:-127.0.0.1}:${TMA_APP_PORT:-8001}:8001"
    environment:
      <<: *php-env
      # Browser-facing. Must be the public origin, because the browser reads
      # these from GET /me to open its websocket. With TLS in front, that is
      # your real hostname on 443 over wss.
      REVERB_HOST: ${TMA_REVERB_PUBLIC_HOST:-localhost}
      REVERB_PORT: ${TMA_REVERB_PUBLIC_PORT:-8001}
      REVERB_SCHEME: ${TMA_REVERB_PUBLIC_SCHEME:-http}
    volumes:
      # Leaf directories only. A volume at storage/ or storage/app/private
      # would mask the 285 committed documents under storage/app/private/vault
      # that every files row with disk='local' still resolves against.
      - uploads:/var/www/html/storage/app/private/uploads
      - thumbs:/var/www/html/storage/app/private/thumbs
      - logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Queue worker — everything except sender photos.
  #
  # Two replicas because SyncSharePointLibrary self-chains with a 2-second
  # delay and a 1800s timeout for tens of thousands of items, monopolising a
  # single worker for the whole of a first-time library connect.
  # ---------------------------------------------------------------------------
  queue:
    <<: *php
    deploy:
      replicas: 2
    command: >
      php artisan queue:work
      --queue=default,cbi
      --tries=3
      --backoff=10
      --timeout=300
      --max-time=3600
      --rest=0.2
    environment:
      <<: *php-env
      # Server-side only; never rendered into a page.
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      # Shared with app: the worker writes thumbnails that the web container
      # serves by path, and assembles chunked uploads across many requests.
      - uploads:/var/www/html/storage/app/private/uploads
      - thumbs:/var/www/html/storage/app/private/thumbs
      - logs:/var/www/html/storage/logs
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Sender photos, on their own worker.
  #
  # app/Jobs/ResolveSenderPhoto.php documents ~4,000 duplicate photo jobs
  # starving mail sync on a shared queue, and config/mail.php prescribes
  # exactly this split. It only works if MAIL_PHOTOS_QUEUE=mail-photos is set —
  # the config default is 'default', which would leave this container idle
  # while the flood continues on the queue it was meant to drain.
  # ---------------------------------------------------------------------------
  queue-photos:
    <<: *php
    command: >
      php artisan queue:work
      --queue=mail-photos
      --tries=2
      --backoff=30
      --timeout=60
      --max-time=3600
      --rest=0.5
    environment:
      <<: *php-env
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - thumbs:/var/www/html/storage/app/private/thumbs
      - logs:/var/www/html/storage/logs
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Scheduler. Exactly one replica, always — no schedule entry uses
  # ->onOneServer(), so a second would double every one of the 18 tasks.
  # ---------------------------------------------------------------------------
  scheduler:
    <<: *php
    command: php artisan schedule:work
    environment:
      <<: *php-env
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - uploads:/var/www/html/storage/app/private/uploads
      - thumbs:/var/www/html/storage/app/private/thumbs
      - logs:/var/www/html/storage/logs
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Reverb. Internal only; the app container's nginx proxies /app/ and /apps/
  # to it. Exactly one replica until REVERB_SCALING_ENABLED and its Redis
  # backplane are turned on — otherwise clients are silently partitioned.
  # ---------------------------------------------------------------------------
  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *php-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - logs:/var/www/html/storage/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

volumes:
  # The only copy of the database unless you point DB_HOST elsewhere.
  pgdata:
  # Chunked-upload parts. They live across dozens of separate HTTP requests,
  # so a per-container path would break resumable uploads permanently.
  uploads:
  # Worker writes them, web serves them by path.
  thumbs:
  # config/logging.php pins the emergency logger to storage/logs/laravel.log
  # whatever LOG_CHANNEL says, so this must exist and persist.
  logs:

networks:
  default:
    name: tma-portal-prod
